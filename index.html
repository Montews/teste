<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Crédito - Barilla</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            
            <!-- Esquerda: Menu Hambúrguer (Mobile) + Navegação -->
            <div class="flex items-center space-x-4">
                <button id="menuBtn" onclick="toggleMenu()" class="md:hidden text-2xl focus:outline-none hover:text-red-400">
                    <i class="fa-solid fa-bars"></i>
                </button>
                
                <nav id="navMenu" class="hidden md:flex space-x-6 text-sm font-semibold">
                    <a href="#" onclick="selecionarOpcao('CP Correntista')" class="hover:text-red-400 transition-colors py-2 border-b-2 border-transparent hover:border-red-500">CP Correntista</a>
                    <a href="#" onclick="selecionarOpcao('CP Domicílio')" class="hover:text-red-400 transition-colors py-2 border-b-2 border-transparent hover:border-red-500">CP Domicílio</a>
                    <a href="#" onclick="selecionarOpcao('Consignado')" class="hover:text-red-400 transition-colors py-2 border-b-2 border-transparent hover:border-red-500">Consignado</a>
                </nav>
            </div>

            <!-- Direita: Logo Barilla -->
            <div class="flex items-center">
                <div class="bg-red-600 text-white font-extrabold px-4 py-1.5 rounded-full tracking-wider text-xl shadow-md border border-white">
                    Barilla
                </div>
            </div>
        </div>

        <!-- Menu Mobile Dropdown -->
        <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 px-4 py-3 flex flex-col space-y-2">
            <a href="#" onclick="selecionarOpcao('CP Correntista')" class="block py-2 text-slate-200 hover:text-red-400">CP Correntista</a>
            <a href="#" onclick="selecionarOpcao('CP Domicílio')" class="block py-2 text-slate-200 hover:text-red-400">CP Domicílio</a>
            <a href="#" onclick="selecionarOpcao('Consignado')" class="block py-2 text-slate-200 hover:text-red-400">Consignado</a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-5xl mx-auto w-full p-4 md:p-6 flex-grow">
        
        <!-- Título da Seção Ativa -->
        <div class="mb-6 flex justify-between items-center">
            <h1 id="tituloOpcao" class="text-2xl font-bold text-slate-800">CP Correntista</h1>
            <span id="badgeSubmenu" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Selecione uma Ação</span>
        </div>

        <!-- Submenu das Ações (Gerar Oferta / Gerar Contrato) -->
        <div id="submenusContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <button onclick="carregarFormulario('Gerar Oferta')" class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-red-500 hover:shadow-md transition-all text-left flex items-center space-x-3">
                <div class="p-3 bg-red-50 text-red-600 rounded-lg"><i class="fa-solid fa-file-invoice-dollar text-xl"></i></div>
                <div>
                    <h3 class="font-bold text-slate-800">Gerar Oferta</h3>
                    <p class="text-xs text-slate-500">Criar simulação de pré-aprovado</p>
                </div>
            </button>
            <button onclick="carregarFormulario('Gerar Contrato')" class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-red-500 hover:shadow-md transition-all text-left flex items-center space-x-3">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-file-signature text-xl"></i></div>
                <div>
                    <h3 class="font-bold text-slate-800">Gerar Contrato</h3>
                    <p class="text-xs text-slate-500">Emitir minuta formal com CPF e datas</p>
                </div>
            </button>
        </div>

        <!-- FORMULÁRIO (CPF e Datas) -->
        <div id="formularioArea" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
            <h2 id="formTitulo" class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Preencha os Dados para Processar</h2>
            
            <form onsubmit="processarFormulario(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">CPF do Cliente</label>
                    <input type="text" id="cpfInput" required placeholder="000.000.000-00" 
                        class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Data Inicial</label>
                        <input type="date" id="dataInicio" required 
                            class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Data Final</label>
                        <input type="date" id="dataFim" required 
                            class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors flex justify-center items-center space-x-2">
                    <i class="fa-solid fa-gear"></i>
                    <span>Gerar e Consultar</span>
                </button>
            </form>
        </div>

        <!-- PAINEL DE LOG (Global para todas as páginas) -->
        <div class="bg-slate-900 text-slate-100 rounded-xl p-4 shadow-inner border border-slate-800">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                <span class="text-xs font-mono text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-terminal mr-1"></i> Console de Logs</span>
                <button onclick="limparLogs()" class="text-xs text-slate-400 hover:text-slate-200">Limpar</button>
            </div>
            <div id="logOutput" class="font-mono text-xs space-y-1 max-h-40 overflow-y-auto text-emerald-400">
                <div>[SISTEMA] Portal inicializado. Selecione uma opção acima.</div>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT DE LÓGICA E INTEGRAÇÃO -->
    <script>
        let opcaoAtual = 'CP Correntista';
        let acaoAtual = 'Gerar Oferta';

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function adicionarLog(mensagem, tipo = 'info') {
            const output = document.getElementById('logOutput');
            const dataHora = new Date().toLocaleTimeString();
            const cor = tipo === 'erro' ? 'text-red-400' : (tipo === 'sucesso' ? 'text-emerald-400' : 'text-sky-300');
            
            const novaLinha = document.createElement('div');
            novaLinha.className = cor;
            novaLinha.innerHTML = `[${dataHora}] ${mensagem}`;
            
            output.appendChild(novaLinha);
            output.scrollTop = output.scrollHeight;
        }

        function limparLogs() {
            document.getElementById('logOutput').innerHTML = '<div>[SISTEMA] Logs limpos.</div>';
        }

        function selecionarOpcao(opcao) {
            opcaoAtual = opcao;
            document.getElementById('tituloOpcao').innerText = opcao;
            adicionarLog(`Navegou para a opção: ${opcao}`);
            
            // Oculta/Exibe submenus baseado na opção selecionada
            const submenus = document.getElementById('submenusContainer');
            if (opcao === 'CP Correntista') {
                submenus.classList.remove('hidden');
            } else {
                submenus.classList.add('hidden');
                document.getElementById('badgeSubmenu').innerText = 'Visão Geral';
            }
            
            // Fecha menu mobile se estiver aberto
            document.getElementById('mobileMenu').classList.add('hidden');
        }

        function carregarFormulario(acao) {
            acaoAtual = acao;
            document.getElementById('badgeSubmenu').innerText = acao;
            document.getElementById('formTitulo').innerText = `${acao} - ${opcaoAtual}`;
            adicionarLog(`Ação selecionada: ${acao}`);
        }

        async function processarFormulario(e) {
            e.preventDefault();
            
            const cpf = document.getElementById('cpfInput').value;
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;

            adicionarLog(`Iniciando processamento [${opcaoAtual} -> ${acaoAtual}] para CPF: ${cpf}...`);

            try {
                // Chamada à API do ViaCEP solicitada
                adicionarLog(`Efetuando chamada de API (https://viacep.com.br/ws/01001000/json/)...`);
                
                const response = await fetch('https://viacep.com.br/ws/01001000/json/');
                const data = await response.json();

                if (data.regiao) {
                    adicionarLog(`[RETORNO API] Região recuperada com sucesso: "${data.regiao}"`, 'sucesso');
                } else {
                    adicionarLog(`[RETORNO API] Região não encontrada no objeto retornado.`, 'erro');
                }

                adicionarLog(`Operação de ${acaoAtual} concluída para o período ${dataInicio} até ${dataFim}.`, 'sucesso');

            } catch (error) {
                adicionarLog(`Erro ao integrar com a API: ${error.message}`, 'erro');
            }
        }
    </script>
</body>
</html>
