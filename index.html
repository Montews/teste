<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP - ViaCEP</title>
    <!-- Google Fonts & Tailwind CSS para um visual bonito -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">
        <h1 class="text-2xl font-bold text-slate-800 mb-4 text-center">Consulta de CEP</h1>
        
        <!-- Formulário para alterar o CEP -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="cepInput" placeholder="Digite o CEP (ex: 01001000)" maxlength="8"
                class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="consultarCEP()" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition-colors">
                Buscar
            </button>
        </div>

        <!-- Tabela de Resultados -->
        <div class="overflow-x-auto rounded-lg border border-slate-200">
            <table class="w-full text-left border-collapse">
                <tbody id="resultadoTabela" class="divide-y divide-slate-200 text-sm">
                    <tr>
                        <td colspan="2" class="p-4 text-center text-slate-400">Nenhum dado consultado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function consultarCEP(cepCustomizado = null) {
            const cepDigitado = document.getElementById('cepInput').value.trim();
            const cep = cepCustomizado || cepDigitado || '01001000'; // Padrão inicial

            const tbody = document.getElementById('resultadoTabela');
            tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-slate-500">Carregando...</td></tr>`;

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-red-500 font-semibold">CEP não encontrado!</td></tr>`;
                    return;
                }

                // Monta as linhas da tabela dinamicamente
                let linhas = '';
                for (const [chave, valor] of Object.entries(data)) {
                    linhas += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-semibold text-slate-600 uppercase w-1/3 bg-slate-50 border-r border-slate-200">${chave}</td>
                            <td class="p-3 text-slate-800">${valor || '<span class="text-slate-300 italic">vazio</span>'}</td>
                        </tr>
                    `;
                }
                tbody.innerHTML = linhas;

            } catch (error) {
                console.error('Erro ao buscar CEP:', error);
                tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-red-500 font-semibold">Erro ao consultar a API.</td></tr>`;
            }
        }

        // Executa com o CEP padrão ao carregar a página
        window.onload = () => {
            document.getElementById('cepInput').value = '01001000';
            consultarCEP('01001000');
        };
    </script>
</body>
</html>
